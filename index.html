<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description"
        content="Accessible GIF Play/Pause button with WCAG support. Control animated GIFs with play, pause, and stop for better web accessibility.">
    <meta name="keywords"
        content="GIF accessibility, play pause GIF, accessible animations, WCAG GIF control, stop animated GIF, GIF pause button">
    <link rel="stylesheet" href="style.css">
    <title>Gif PLay/Pause | Accessibility</title>
</head>

<body>
    <div class="box">
        <div>
            <img src="./assets/imagegif.gif" data-gif="./assets/imagegif.gif" id="image"
                data-still="./assets/Static-image.png"
                alt="Animated illustration of two paper boats floating on waves with a sunset." data-state='playing'>
        </div>
        <div class="controls">
            <button id="stopGif" aria-label="Pause GIF">⏸</button>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="script.js"></script>
</body>

</html>
